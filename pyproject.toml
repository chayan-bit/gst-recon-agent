[project]
name = "gst-recon"
version = "0.1.0"
description = "GST ITC reconciliation: world simulator, rules engine, rewards"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gst_recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
