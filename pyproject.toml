[project]
name = "gst-recon"
version = "0.1.0"
description = "GST ITC reconciliation: world simulator, rules engine, rewards"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
render = [
  "jinja2>=3.1",
  "weasyprint>=62",
  "pypdfium2>=4.30",
  "augraphy>=8.2",
  "faker>=25",
  "pillow>=10",
  "numpy>=1.26",
  "tokenizers>=0.20",
]
eval = ["numpy>=1.26", "matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gst_recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
