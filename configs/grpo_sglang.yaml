# GRPO from the SFT adapter with the schema-gated gst_recon_grpo reward (gst_recon/rewards, registered by
# gst_recon/train/reward.py). Rollouts come from an SGLang server (AlignTune fork 5e987f3, TRL GRPO path).
# This is the only GRPO config: the runner refuses GRPO without train.rollout_backend sglang (no HF fallback).
# Policy = base Qwen3-4B (run with MODEL=<the exact local snapshot the server serves>) + the SFT LoRA loaded as
# the trainable adapter (gst_recon.init_adapter). The server runs the same snapshot with --enable-lora, so the
# fork syncs only the adapter (~264 MB to train.sglang_sync_dir on disk) after each optimizer step.
#
# the shared H100 host NVL budget (95830 MiB; nothing else of ours; another user's ~0.6 GB process):
#   SGLang 0.5.10.post1 sizes its KV pool as free_after_load - free_before_load * (1 - mem_fraction_static),
#   so start it FIRST, while ~93 GiB is free. Then 0.45 gives ~42 GiB: 7.5 GiB weights, the LoRA pool, and
#   ~34 GiB KV (144 KiB/token for Qwen3-4B = ~245k tokens). CUDA graphs and activations add ~3 GiB, so ~45 GiB.
#   One rollout is 32 sequences. The fork samples LoRA prompts one by one (no n>1 on SGLang 0.5.10), but the
#   radix cache still shares each prompt's prefill: typically 32 x ~6.3k = ~200k tokens. The worst case is
#   32 x 10240 = 327k; SGLang queues the excess rather than failing.
#   The trainer gets the other ~48 GiB and needs ~21-25 GiB:
#     - 7.5 GiB bf16 policy;
#     - ~1 GiB LoRA + 8-bit Adam;
#     - ~4 GiB of checkpointed activations for 2 x 10240 tokens;
#     - ~8 GiB of completion logits and their gradient.
#   beta 0 means no reference forward pass.
# Host RAM: adapter sync stages ~264 MB, and the trainer was ~3 GB, so run_guarded CAP_GB=8 (abort below 8 GB).
#
# configs/launch_grpo.sh starts the server, waits for health and runs this under run_guarded.
algo: grpo
backend: trl  # unsloth + sglang is refused by the fork by design

model:
  name_or_path: Qwen/Qwen3-4B-Instruct-2507  # launch_grpo.sh substitutes the local snapshot (MODEL=...)
  precision: bf16
  # build keeps GRPO cases with prompt <= 6144 (incl. system prompt) and target <= 3072
  max_seq_length: 10240
  gradient_checkpointing: true
  use_peft: true
  # must match the SFT adapter exactly (the runner checks): r32, alpha 64, plain LoRA, all 7 projections
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

datasets:
  - name: data/train/curated/grpo-merged  # 194 teacher-paraphrased + 474 Windows-workstation unparaphrased rows; directory with train.jsonl (columns: prompt messages, reference = truth JSON)
    split: train

rewards:
  - type: gst_recon_grpo  # 0 unless schema-valid; trivial baselines ~0.27, truth 1.0
    weight: 1.0

train:
  rollout_backend: sglang
  sglang_server_url: http://127.0.0.1:30001  # port 30001, never the teacher's or eval server's 30000
  sglang_sync_dir: runs/grpo-sync  # = ~/gst-recon/runs/grpo-sync via the repo's runs link; on disk, never /dev/shm
  # the 3 h wall-clock cap (gst_recon.max_hours) binds, not this: 334 steps = 2 passes over grpo-merged
  # (668 prompts / 4 per step); the LR is constant after warmup, so stopping at any step is fine
  max_steps: 334
  # 2 x 16 = 32 completions per optimizer step = 4 prompts x 8 generations.
  # Batch 2 keeps the 10k-token logits and activations inside the trainer budget.
  per_device_batch_size: 2
  gradient_accumulation_steps: 16
  num_generations: 8
  learning_rate: 5.0e-6
  warmup_ratio: 0.03
  # no KL: with a PEFT policy TRL's reference is the adapter-disabled model, i.e. the base model,
  # not the SFT policy, so a KL term would pull the policy back towards pre-SFT behaviour
  beta: 0.0
  loss_type: grpo
  scale_rewards: group
  temperature: 0.8
  top_p: 0.95
  max_prompt_length: 6144
  max_completion_length: 4096  # ~1k tokens of slack over the longest target
  logging_steps: 1
  save_steps: 50
  save_total_limit: 2  # LoRA + 8-bit optimizer state, well under 1 GB per checkpoint
  seed: 42

logging:
  output_dir: runs/grpo-sglang
  run_name: gst-recon-grpo-sglang
  loggers: [tensorboard]

chat_template: auto

# Runner-only knobs (python -m gst_recon.train run). init_adapter and max_hours are handled by the runner.
# The others are create_rl_trainer kwargs that AlignTune's YAML parser silently drops from the train
# section (gradient_checkpointing true = standard checkpointing).
gst_recon:
  init_adapter: runs/sft-curated  # the e2e SFT LoRA, loaded as the trainable policy (not merged)
  max_hours: 3  # wall-clock cap: save, then stop
  mask_truncated_completions: true
  gradient_checkpointing: true
  optimizer: adamw_8bit
  lr_scheduler: constant_with_warmup
  dataloader_num_workers: 0
