# GRPO from the SFT model with the schema-gated gst_recon_grpo reward (gst_recon/rewards, registered by
# gst_recon/train/reward.py), with rollouts generated by an SGLang server (AlignTune fork, TRL GRPO path).
# This is the only GRPO config: the runner refuses GRPO without rollout_backend sglang (no HF fallback).
# GRPO starts from the merged SFT model (AlignTune GRPO does not load a separate SFT adapter), so merge
# runs/sft-curated into runs/sft-curated/merged first. The SGLang server serves that same merged model.
#
# rs-epyc H100 NVL budget (95830 MiB; teacher stopped; another user's ~0.6 GB process):
#   SGLang 0.5.10.post1 sizes its KV pool as free_after_load - free_before_load * (1 - mem_fraction_static),
#   so start it FIRST, while ~93 GiB is free. Then 0.40 gives ~37 GiB: 7.5 GiB weights + ~29.7 GiB KV
#   (144 KiB/token for Qwen3-4B, 36 layers x 8 KV heads x 128 x K,V x bf16 = ~216k tokens), plus ~3 GiB
#   of CUDA graphs and activations outside the fraction (capped by --cuda-graph-max-bs 32), so ~41 GiB.
#   The worst-case rollout is 4 prompts x (6144 shared prefill + 8 x 4096 completion) = 156k tokens.
#   The trainer gets the other ~52 GiB: 7.5 GiB bf16 policy (the LoRA-disabled model is the KL reference),
#   ~1 GiB LoRA + 8-bit Adam, ~4 GiB of checkpointed activations for 2 x 10240 tokens, ~8 GiB of
#   completion logits (2 x 4096 x 151936) and their gradient, and +7 GiB during each weight sync (merged
#   bf16 copies of the LoRA'd weights). That is ~28-35 GiB, about 15 GiB of headroom.
# Host RAM: each weight sync stages the whole merged model (~8 GB) in host RAM (safetensors 0.8
#   save_file copies every tensor to the CPU before writing), on top of the trainer's ~3 GB, so the
#   12 GB run_guarded cap is marginal; it needs CAP_GB=16, which the coordinator must approve.
# Disk: the sync file (~8 GB, overwritten every step) goes to runs/grpo-sglang-sync, never /dev/shm.
#
# configs/launch_grpo.sh does all of this (merge, server, guarded 3 h run). By hand, from the repo root:
#   TORCHINDUCTOR_COMPILE_THREADS=1 ~/gst-recon/venv-sglang/bin/python -m sglang.launch_server \
#     --model-path $PWD/runs/sft-curated/merged --host 127.0.0.1 --port 30001 \
#     --mem-fraction-static 0.40 --context-length 10240 --max-running-requests 32 --cuda-graph-max-bs 32 \
#     --skip-tokenizer-init --sleep-on-idle
#   PYTHON=~/gst-recon/venv-align/bin/python bash configs/run_guarded.sh configs/grpo_sglang.yaml
algo: grpo
backend: trl  # the fork's SGLang rollout is wired into TRLGRPOTrainer; the unsloth backend ignores it

model:
  name_or_path: runs/sft-curated/merged
  precision: bf16
  # build keeps GRPO cases with prompt <= 6144 (incl. system prompt) and target <= 3072
  max_seq_length: 10240
  gradient_checkpointing: true
  use_peft: true
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

datasets:
  - name: data/train/curated/grpo-merged  # 194 teacher-paraphrased + 474 rs-lab unparaphrased rows; directory with train.jsonl (columns: prompt messages, reference = truth JSON)
    split: train

rewards:
  - type: gst_recon_grpo  # 0 unless schema-valid; trivial baselines ~0.27, truth 1.0
    weight: 1.0

train:
  # one pass over grpo-merged (668 prompts / 4 per step). Estimated 60-90 s/step (rollout ~15-60 s, update
  # ~30 s, weight sync to disk ~10-40 s), so ~3-4 h; configs/launch_grpo.sh time-boxes it at 3 h and the
  # step-50/100/150 adapters are the stop-anytime results.
  max_steps: 167
  # 2 x 16 = 32 completions per optimizer step = 4 prompts x 8 generations, one SGLang request with n=8
  # per prompt (shared prefill). Batch 2 keeps the 10k-token logits and activations inside the trainer budget.
  per_device_batch_size: 2
  gradient_accumulation_steps: 16
  num_generations: 8
  learning_rate: 5.0e-6
  beta: 0.01  # small KL to the reference policy
  loss_type: grpo
  scale_rewards: group
  temperature: 0.8
  top_p: 0.95
  max_prompt_length: 6144
  max_completion_length: 4096  # ~1k tokens of slack over the longest target
  logging_steps: 1
  save_steps: 50
  save_total_limit: 2  # LoRA + 8-bit optimizer state, well under 1 GB per checkpoint
  seed: 42

logging:
  output_dir: runs/grpo-curated
  run_name: gst-recon-grpo-curated
  loggers: [tensorboard]

chat_template: auto

# Runner-only knobs (python -m gst_recon.train run), passed to create_rl_trainer as kwargs.
# PENDING: the rollout keys below are the names on the fork branch feat/sglang-rollout today. Confirm
# them, and the install ref, against the rollout worker's sglang 0.5.10.post1 build before launching.
# The runner refuses this config if the installed AlignTune has no SGLang rollout, and it makes the
# sync dir absolute, because the server resolves the path it receives from its own working directory.
# The other keys are create_rl_trainer kwargs that AlignTune 0.1.28's YAML parser silently drops
# from the train section (gradient_checkpointing true = standard checkpointing).
gst_recon:
  rollout_backend: sglang
  sglang_server_url: http://127.0.0.1:30001  # PENDING key name; port 30001 so it never hits the teacher's 30000
  sglang_sync_dir: runs/grpo-sglang-sync  # PENDING key name; on disk, never /dev/shm on rs-epyc
  mask_truncated_completions: true
  gradient_checkpointing: true
  optimizer: adamw_8bit
  lr_scheduler: cosine
  dataloader_num_workers: 0
