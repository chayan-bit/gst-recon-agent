# GRPO from the SFT model with the schema-gated gst_recon_grpo reward (gst_recon/rewards, registered
# by gst_recon/train/reward.py). Run from the repo root:  python -m gst_recon.train run configs/grpo.yaml
# GRPO starts from the merged SFT model: AlignTune 0.1.28 GRPO does not load a separate SFT adapter
# (model.sft_path is unused), so merge runs/sft-curated into runs/sft-curated/merged first.
algo: grpo
backend: unsloth

model:
  name_or_path: runs/sft-curated/merged
  precision: bf16
  # unsloth GRPO derives lengths from this: 60% prompt (6144) / 40% completion (4096).
  # build keeps GRPO cases with prompt <= 6144 (incl. system prompt) and target <= 3072,
  # so the completion cap leaves ~1k tokens of slack over the longest target
  max_seq_length: 10240
  gradient_checkpointing: true
  use_peft: true
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

datasets:
  - name: data/train/curated/grpo  # directory with train.jsonl (columns: prompt messages, reference = truth JSON)
    split: train

rewards:
  - type: gst_recon_grpo  # 0 unless schema-valid; trivial baselines ~0.27, truth 1.0
    weight: 1.0

train:
  max_steps: 300
  per_device_batch_size: 8  # one prompt x num_generations per device step
  gradient_accumulation_steps: 4
  num_generations: 8
  learning_rate: 5.0e-6
  beta: 0.01  # small KL to the reference policy
  loss_type: grpo
  scale_rewards: group
  temperature: 0.8
  top_p: 0.95
  max_prompt_length: 6144  # used by the trl backend; unsloth uses the max_seq_length split above
  max_completion_length: 4096
  mask_truncated_completions: true
  logging_steps: 1
  save_steps: 50
  save_total_limit: 1  # rs-epyc disk is tight
  seed: 42

logging:
  output_dir: runs/grpo-curated
  run_name: gst-recon-grpo-curated
  loggers: [tensorboard]

chat_template: auto

# Runner-only knobs (python -m gst_recon.train run), passed to create_rl_trainer as kwargs.
# AlignTune 0.1.28 does not read rollout_backend from YAML or kwargs (always HF generate);
# set it to sglang once the AlignTune fork with the SGLang rollout lands.
gst_recon:
  rollout_backend: hf
