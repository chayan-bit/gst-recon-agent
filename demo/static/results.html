<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GST Recon - results</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2334d399'/%3E%3Cpath d='M9 17l5 5 9-11' fill='none' stroke='%230a0d12' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { display: block; height: auto; min-height: 100%; overflow: auto; }
  .wrap { max-width: 1760px; margin: 0 auto; padding: 24px 20px 16px; display: grid; grid-template-columns: 1fr 560px; align-items: start; gap: 20px; }
  .wrap > header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 20px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -.01em; }
  .sub { color: var(--muted); }
  .back { color: var(--accent); text-decoration: none; font-weight: 600; margin-left: auto; white-space: nowrap; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 28px; }
  .card h2 { margin: 0 0 4px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .card .lead { color: var(--dim); margin: 0 0 14px; font-size: 13px; }
  .reader { display: grid; grid-template-columns: 260px 1fr 100px; gap: 24px; align-items: center; padding: 44px 0; border-top: 1px solid var(--line); }
  .reader:first-of-type { border-top: 0; }
  .reader .nm { font-weight: 650; font-size: 18px; }
  .reader .nm small { display: block; color: var(--dim); font-weight: 500; font-size: 12px; margin-top: 3px; }
  .reader.ours { background: rgba(120, 160, 255, .06); margin: 0 -28px; padding: 44px 28px; border-radius: 10px; border-top-color: transparent; }
  .reader.ours .nm { color: var(--accent); }
  .m { display: grid; grid-template-columns: 78px 1fr 52px; align-items: center; gap: 10px; margin: 6px 0; font-size: 13.5px; color: var(--muted); }
  .track { height: 20px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
  .track i { display: block; height: 100%; width: 0; border-radius: 5px; background: #55627a; transition: width .7s cubic-bezier(.2, .8, .2, 1); }
  .ours .track i { background: var(--accent); }
  .m .n { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .invd { text-align: right; }
  .invd b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; }
  .invd span { display: block; white-space: nowrap; margin-top: 2px; color: var(--dim); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .side { display: flex; flex-direction: column; gap: 20px; }
  .def { margin: 10px 0; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
  .def b { color: var(--text); }
  .note { margin: 12px 0; color: var(--text); font-size: 14px; line-height: 1.5; }
  .src { grid-column: 1 / -1; color: var(--dim); font-size: 12.5px; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <span class="sub" id="metricNote"></span>
    <a class="back" href="/">&larr; Live demo</a>
  </header>
  <section class="card">
    <h2 id="set"></h2>
    <p class="lead">Higher is better, except invented IDs.</p>
    <div id="readers"></div>
  </section>
  <div class="side"><section class="card" id="defs"></section><section class="card" id="notes"></section></div>
  <p class="src" id="foot"></p>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const metric = (name, v) => `<div class="m"><span>${name}</span><div class="track"><i data-w="${v}"></i></div><span class="n">${v.toFixed(1)}</span></div>`;

fetch("/static/results.json").then((r) => r.json()).then((d) => {
  $("title").textContent = d.title;
  $("metricNote").textContent = d.metric_note;
  $("set").textContent = d.set;
  $("readers").innerHTML = d.readers.map((r) => `
    <div class="reader${r.ours ? " ours" : ""}">
      <div class="nm">${esc(r.label)}<small>${esc(r.sub)}</small></div>
      <div>${metric("ITC exact", r.itc)}${metric("Match", r.match)}${metric("Composite", r.composite)}</div>
      <div class="invd"><b>${r.invented.toFixed(1)}%</b><span>invented IDs</span></div>
    </div>`).join("");
  $("defs").innerHTML = `<h2>What the columns mean</h2>` + d.defs.map(([k, v]) => `<p class="def"><b>${esc(k)}</b>: ${esc(v)}.</p>`).join("");
  $("notes").innerHTML = `<h2>Read this with</h2>` + d.notes.map((n) => `<p class="note">${esc(n)}</p>`).join("");
  $("foot").textContent = `Source: ${d.source}`;
  requestAnimationFrame(() => document.querySelectorAll(".track i").forEach((i) => { i.style.width = `${i.dataset.w}%`; }));
});
</script>
</body>
</html>
