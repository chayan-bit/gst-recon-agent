<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GST Recon - results</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2334d399'/%3E%3Cpath d='M9 17l5 5 9-11' fill='none' stroke='%230a0d12' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { display: block; height: auto; min-height: 100%; overflow: auto; }
  .wrap { max-width: 1760px; margin: 0 auto; padding: 28px 20px 40px; display: grid; grid-template-columns: 1fr 520px; gap: 20px; }
  .wrap > header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 20px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -.01em; }
  .sub { color: var(--muted); max-width: 900px; }
  .back { color: var(--accent); text-decoration: none; font-weight: 600; margin-left: auto; white-space: nowrap; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; }
  .card h2 { margin: 0 0 4px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .card .lead { color: var(--dim); margin: 0 0 18px; font-size: 13px; }
  .legend { display: flex; gap: 18px; margin-bottom: 8px; font-size: 12.5px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .chart { display: flex; align-items: flex-end; gap: 18px; height: 520px; padding: 24px 4px 0; border-bottom: 1px solid var(--line-2); position: relative; }
  .grid { position: absolute; inset: 24px 0 0 0; pointer-events: none; }
  .grid span { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); font-size: 10.5px; color: var(--dim); }
  .grid span b { position: absolute; right: 0; top: -15px; font-weight: 500; }
  .group { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 8px; height: 100%; position: relative; z-index: 1; }
  .gap { width: 22px; flex: none; }
  .bar { width: 38%; max-width: 64px; border-radius: 8px 8px 0 0; position: relative; min-height: 6px; transition: height .6s cubic-bezier(.2, .8, .2, 1); }
  .bar.iid { background: #55627a; } .bar.ood { background: var(--accent); }
  .bar.ref.iid { background: #4a6b5f; } .bar.ref.ood { background: var(--ok); }
  .bar .v { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); padding-bottom: 5px; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar.todo { background: transparent; border: 1.5px dashed var(--line-2); border-bottom: 0; height: 56px !important; }
  .bar.todo .v { color: var(--warn); font-size: 11px; letter-spacing: .08em; font-weight: 700; }
  .labels { display: flex; gap: 18px; padding: 12px 4px 0; }
  .labels > div { flex: 1; text-align: center; }
  .labels .gap { flex: none; }
  .labels b { display: block; font-size: 14px; }
  .labels span { display: block; color: var(--muted); font-size: 12px; }
  .labels em { display: block; color: var(--warn); font-size: 11px; font-style: normal; margin-top: 3px; }
  .pair { margin: 22px 0 6px; }
  .pair .nm { font-weight: 600; margin-bottom: 8px; }
  .row { display: grid; grid-template-columns: 112px 1fr 56px; align-items: center; gap: 10px; margin: 6px 0; font-size: 13px; color: var(--muted); }
  .track { height: 22px; background: var(--panel-2); border-radius: 6px; overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 6px; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
  .row .n { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .src { grid-column: 1 / -1; color: var(--dim); font-size: 12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The climb: base, SFT, GRPO</h1>
    <span class="sub" id="metricNote"></span>
    <a class="back" href="/">&larr; Live demo</a>
  </header>
  <section class="card">
    <h2>ITC invoice exact on held-out cases</h2>
    <p class="lead">Each step adds one thing. Open-model and frontier references on the right.</p>
    <div class="legend"><span><i style="background:#55627a"></i>In-distribution</span><span><i style="background:var(--accent)"></i>Out-of-distribution</span></div>
    <div class="chart" id="chart"></div>
    <div class="labels" id="labels"></div>
  </section>
  <section class="card" id="decoding"></section>
  <p class="src" id="foot"></p>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmt = (v) => `${v.toFixed(1)}%`;

function bar(kind, v, ref) {
  const todo = v == null;
  return `<div class="bar ${kind}${ref ? " ref" : ""}${todo ? " todo" : ""}" data-h="${todo ? 0 : v}"><span class="v">${todo ? "TODO" : fmt(v)}</span></div>`;
}

fetch("/static/results.json").then((r) => r.json()).then((d) => {
  $("metricNote").textContent = d.metric_note;
  const cols = [...d.steps.map((s) => ({ ...s })), { gap: true }, ...d.references.map((s) => ({ ...s, ref: true }))];
  $("chart").innerHTML = `<div class="grid">${[100, 75, 50, 25, 0].map((t) => `<span style="top:${100 - t}%"><b>${t}</b></span>`).join("")}</div>` +
    cols.map((c) => c.gap ? `<div class="gap"></div>` : `<div class="group">${bar("iid", c.iid, c.ref)}${bar("ood", c.ood, c.ref)}</div>`).join("");
  $("labels").innerHTML = cols.map((c) => c.gap ? `<div class="gap"></div>` : `<div><b>${esc(c.label)}</b><span>${esc(c.sub)}</span>${c.note ? `<em>${esc(c.note)}</em>` : ""}</div>`).join("");
  requestAnimationFrame(() => document.querySelectorAll(".bar").forEach((b) => { if (!b.classList.contains("todo")) b.style.height = `${b.dataset.h}%`; }));

  const dec = d.decoding;
  $("decoding").innerHTML = `<h2>${esc(dec.title)}</h2><p class="lead">${esc(dec.sub)}</p>` + dec.rows.map((r) => `
    <div class="pair"><div class="nm">${esc(r.label)}</div>
      <div class="row"><span>Unconstrained</span><div class="track"><i style="width:${r.unconstrained}%;background:var(--bad)"></i></div><span class="n">${fmt(r.unconstrained)}</span></div>
      <div class="row"><span>Constrained</span><div class="track"><i style="width:${r.constrained}%;background:var(--ok)"></i></div><span class="n">${fmt(r.constrained)}</span></div>
    </div>`).join("") + `<p class="lead" style="margin-top:20px;color:var(--warn)">${esc(dec.todo)}</p>`;
  $("foot").textContent = `Source: ${d.source}`;
});
</script>
</body>
</html>
