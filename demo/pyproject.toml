[project]
name = "gst-demo"
version = "0.1.0"
description = "Live demo UI for gst-recon: streams the SGLang model output and renders the reconciliation table"
requires-python = ">=3.11"
dependencies = ["gst-recon", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
gst-recon = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gst_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
